name: Lint

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: "shivammathur/setup-php@v2"

      - uses: "ramsey/composer-install@v4"

      - run: composer run lint
